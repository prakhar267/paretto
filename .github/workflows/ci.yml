name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    name: Web release gate (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    env:
      CI: true
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install the locked dependency graph
        run: npm ci

      - name: Run the complete release gate
        run: npm run release:verify

  native-gate:
    name: Native iPhone and iPad release gate (Xcode 26.3)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Report the Apple toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test the shared learning core
        run: swift test --package-path ios/ParettoCore

      - name: Compile and test the native application package
        run: swift test --package-path ios/Paretto

      - name: Test on an iOS Simulator without signing
        run: >-
          xcodebuild
          -project ios/Paretto/Paretto.xcodeproj
          -scheme Paretto
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Test the adaptive iPad layout without signing
        run: >-
          xcodebuild
          -project ios/Paretto/Paretto.xcodeproj
          -scheme Paretto
          -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M4),OS=latest'
          CODE_SIGNING_ALLOWED=NO
          test

      - name: Confirm tests did not mutate tracked release inputs
        run: git diff --exit-code
