name: PasAPas
options:
  bundleIdPrefix: com.pasapas
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
packages:
  PasAPasCore:
    path: ../PasAPasCore
configs:
  Debug: debug
  Staging: release
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  PasAPas:
    type: application
    platform: iOS
    configFiles:
      Debug: Configuration/Shared.xcconfig
      Staging: Configuration/Shared.xcconfig
      Release: Configuration/Shared.xcconfig
    sources:
      - path: PasAPasApp
      - path: ../../public/audio/fr
        name: FrenchAudio
        type: folder
        buildPhase: resources
    dependencies:
      - package: PasAPasCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pasapas.french
        PRODUCT_NAME: Pas à Pas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: PasAPasApp/PasAPas.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          PASAPAS_API_BASE_URL: http:/$()/localhost:3000
        Staging:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING
          PASAPAS_API_BASE_URL: $(PASAPAS_STAGING_API_BASE_URL)
        Release:
          PASAPAS_API_BASE_URL: $(PASAPAS_PRODUCTION_API_BASE_URL)
    info:
      path: PasAPasApp/Info.plist
      properties:
        CFBundleDisplayName: Pas à Pas
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        PASAPAS_API_BASE_URL: $(PASAPAS_API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      testTargets:
        - PasAPasTests
        - PasAPasUITests
      gatherCoverageData: true
  PasAPasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PasAPasTests]
    dependencies:
      - target: PasAPas
      - package: PasAPasCore
  PasAPasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PasAPasUITests]
    dependencies:
      - target: PasAPas
schemes:
  PasAPas-Staging:
    build:
      targets:
        PasAPas: all
    run:
      config: Staging
    test:
      config: Staging
      targets:
        - PasAPasTests
        - PasAPasUITests
    archive:
      config: Staging
