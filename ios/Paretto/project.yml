name: Paretto
options:
  bundleIdPrefix: com.paretto
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
packages:
  ParettoCore:
    path: ../ParettoCore
configs:
  Debug: debug
  Staging: release
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: 1.5.0
    CURRENT_PROJECT_VERSION: 12
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Paretto:
    type: application
    platform: iOS
    configFiles:
      Debug: Configuration/Shared.xcconfig
      Staging: Configuration/Shared.xcconfig
      Release: Configuration/Shared.xcconfig
    sources:
      - path: ParettoApp
      - path: ../../public/audio/fr
        name: FrenchAudio
        type: folder
        buildPhase: resources
    dependencies:
      - package: ParettoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.paretto.app
        PRODUCT_NAME: Paretto
        PRODUCT_MODULE_NAME: Paretto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: ParettoApp/Paretto.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          PARETTO_API_BASE_URL: http:/$()/localhost:3000
        Staging:
          ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: STAGING
          PARETTO_API_BASE_URL: $(PARETTO_STAGING_API_BASE_URL)
        Release:
          PARETTO_API_BASE_URL: $(PARETTO_PRODUCTION_API_BASE_URL)
    info:
      path: ParettoApp/Info.plist
      properties:
        CFBundleDisplayName: Paretto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        PARETTO_API_BASE_URL: $(PARETTO_API_BASE_URL)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    scheme:
      testTargets:
        - ParettoTests
        - ParettoUITests
      gatherCoverageData: true
  ParettoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ParettoTests]
    dependencies:
      - target: Paretto
      - package: ParettoCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Paretto.app/Paretto"
        BUNDLE_LOADER: "$(TEST_HOST)"
  ParettoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ParettoUITests]
    dependencies:
      - target: Paretto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Paretto-Staging:
    build:
      targets:
        Paretto: all
    run:
      config: Staging
    test:
      config: Staging
      targets:
        - ParettoTests
        - ParettoUITests
    archive:
      config: Staging
